[project]
name = "hw-control"
version = "0.1.0"
description = "hw-control module of Composable Disaggregated Infrastructure Manager"
authors = [{ name = "NEC Corporation" }]
dependencies = [
    "PyYAML>=6.0.2",
    "fastapi>=0.112.2",
    "pandas>=2.2.2",
    "pydantic-settings>=2.4.0",
    "pydantic>=2.8.2",
    "requests>=2.32.3",
    "urllib3>=2.2.2",
    "uvicorn>=0.30.6",
    "python-json-logger>=3.3.0",
]
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[dependency-groups]
dev = [
    "black==24.8.0",
    "httpx>=0.27.2",
    "mypy>=1.15.0",
    "pandas-stubs>=2.2.2.240807",
    "pylint>=3.2.7",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest>=8.3.2",
    "types-PyYAML>=6.0.12.20240808",
    "types-requests>=2.32.0.20240712",
]

[tool.black]
line-length = 120

[tool.mypy]
enable_error_code = ["ignore-without-code"]
mypy_path = "src"
plugins = ['pydantic.mypy']

[tool.pylint.format]
max-line-length = 120
max-module-lines = 1600

[tool.pylint.refactoring]
max-nested-blocks = 4

[tool.pytest.ini_options]
pythonpath = "src"


[tool.pdm]
distribution = true

[tool.pdm.scripts]
start.cmd = "uvicorn app.hw_control_main:app --host 0.0.0.0 --port 8000 --reload --log-config config/logging_config.yaml"
start.env = { PYTHONPATH = "${PDM_PROJECT_ROOT}/src" }
test = "pytest --cov-branch --cov-report=term:skip-covered --cov-report=xml:coverage-reports/coverage-all.xml --cov=src/"
format = "black src tests"
lint.composite = ["black --check src tests", "pylint src tests", "mypy src tests"]
lint.keep_going = true
