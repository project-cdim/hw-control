[project]
name = "hw-control"
version = "0.2.1"
description = "hw-control module of Composable Disaggregated Infrastructure Manager"
authors = [{ name = "NEC Corporation" }]
dependencies = [
    "PyYAML>=6.0.2",
    "fastapi>=0.112.2",
    "pandas>=2.2.2,<3",
    "pydantic-settings>=2.14.2",
    "pydantic>=2.8.2",
    "requests>=2.32.3",
    "urllib3>=2.2.2",
    "uvicorn[standard]>=0.40.0",
    "python-json-logger>=3.3.0",
    "asgi-correlation-id>=4.3.4",
    "starlette>=1.3.1",
    "sqlalchemy>=2.0.51",
    "psycopg[binary]>=3.3.4",
]
requires-python = ">=3.13"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pandas-stubs>=2.2.2.240807",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest>=8.3.2",
    "types-PyYAML>=6.0.12.20240808",
    "types-requests>=2.32.0.20240712",
    "pip-audit>=2.10.0",
    "deptry>=0.25.1",
    "testcontainers[keycloak]>=4.14.2",
    "pyjwt[crypto]>=2.12.1",
    "ruff>=0.15.12",
    "httpx2>=2.4.0",
]

[tool.deptry]
known_first_party = ["app"]
extend_exclude = ["integration_tests"]

[tool.deptry.per_rule_ignores]
DEP002 = [
    "psycopg",            # PostgreSQL driver required by SQLAlchemy at runtime.
    "python-json-logger",
    "uvicorn",
]

[tool.ruff]
line-length = 120
extend-exclude = [
    "src/app/common/dim",
    "tests/app/common/dim",
]

[tool.ruff.lint]
explicit-preview-rules = true
select = [
    # "ARG",  # flake8-unused-arguments: detect unused function arguments
    "B",    # flake8-bugbear: detect bugs and design issues
    "CPY",  # flake8-copyright: check copyright notice at the top of files
    "D",    # pydocstyle: check docstring style and presence
    "E",    # pycodestyle errors: PEP 8 style errors
    "F",    # Pyflakes: detect common Python errors
    "FAST", # FastAPI: FastAPI-specific best practice checks
    "G",    # flake8-logging-format: enforce logging format best practices
    "I",    # isort: organize import order and grouping
    "LOG",  # flake8-logging: detect logging anti-patterns
    "N",    # pep8-naming: enforce PEP 8 naming conventions
    "PL",   # Pylint: broad code quality checks
    "PT",   # flake8-pytest-style: enforce pytest best practices
    "S",    # flake8-bandit: detect security issues
    "UP",   # pyupgrade: automatically update old Python syntax to newer syntax
    "W",    # pycodestyle warnings: PEP 8 style warnings
]
ignore = [
    "PLR", # Pylint Refactoring: exclude refactoring suggestions
]

[tool.ruff.lint.per-file-ignores]
"{tests,integration_tests}/**/*.py" = [
    "B", # flake8-bugbear: excluded for test code
    "D", # pydocstyle: excluded for test code
    "S", # flake8-bandit: excluded for test code
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-nested-blocks = 4

[tool.mypy]
enable_error_code = ["ignore-without-code"]
mypy_path = "src"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
exclude = [
    "src/app/common/dim",
    "tests/app/common/dim",
]

[[tool.mypy.overrides]]
module = ["testcontainers", "testcontainers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["keycloak", "keycloak.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = "src"
filterwarnings = [
    # NOT NULL constraint tests intentionally pass NULL to PK columns
    "ignore:Column .* is marked as a member of the primary key:sqlalchemy.exc.SAWarning",
]


[tool.pdm]
distribution = true

[tool.pdm.resolution]
exclude-newer = "3d"

[tool.pdm.scripts]
start.cmd = "uvicorn app.hw_control_main:app --host 0.0.0.0 --port 8000 --reload --log-config config/logging_config.yaml"
start.env = { PYTHONPATH = "${PDM_PROJECT_ROOT}/src" }
test = "pytest --cov-branch --cov-report=term:skip-covered --cov-report=xml:coverage-reports/coverage-all.xml --cov=src/ tests/"
test-it = "pytest integration_tests/"
format = "ruff format"
lint.composite = [
    "ruff format --check",
    "ruff check",
    "mypy .",
    "deptry .",
]
lint.keep_going = true
